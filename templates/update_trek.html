<!DOCTYPE html>
<html>

    <head>
        <title>{{ title }}</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>


    <body>
        <div class="container mt-5">

        {% with messages = get_flashed_messages() %} 
				{% if messages %} 
					{% for message in messages %} 
						<div style=" 
							background: #d4edda; 
							color: #155724; 
							padding: 10px; 
                            text-align: center;
							margin-bottom: 15px; 
							border-radius: 5px; 
						"> 
							{{ message }} 
						</div> 
					{% endfor %} 
				{% endif %} 
	{% endwith %}


    
    <h1>Update Trek</h1>
    <h2 class="mb-4">{{ trek.name }}</h2>

    <form method="POST">

        <label class="form-label">Available Slots</label><br>
        <input type="number" name="available_slots" class="form-control" value="{{ trek.available_slots }}" required style="max-width: 400px;"><br><br>

        <label class="form-label">Status</label><br>
        <select name="status" class="form-select" style="max-width: 400px;">

            <option value="Pending" {% if trek.status == "Pending" %}selected{% endif %}>
                Pending
            </option>

            <option value="Open" {% if trek.status == "Open" %}selected{% endif %}>
                Open
            </option>

            <option value="Closed" {% if trek.status == "Closed" %}selected{% endif %}>
                Closed
            </option>

            <option value="Started" {% if trek.status == "Started" %}selected{% endif %}>
                Started
            </option>

            <option value="Completed" {% if trek.status == "Completed" %}selected{% endif %}>
                Completed
            </option>

        </select>

        <br><br>

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

    </form>

    <br>

    <a href="{{ url_for('staff_dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>

</div>

</body>
</html>
