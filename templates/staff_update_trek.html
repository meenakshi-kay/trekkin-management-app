<!DOCTYPE html>
<html>

    <head>
        <title>{{ title }}</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body>
        <div class="container mt-5">



        {% with messages = get_flashed_messages() %} 
                    {% if messages %} 
                        {% for message in messages %} 
                            <div style=" 
                                background: #d4edda; 
                                color: #155724; 
                                text-align: center;
                                padding: 10px; 
                                margin-bottom: 15px; 
                                border-radius: 5px; 
                            "> 
                                {{ message }} 
                            </div> 
                        {% endfor %} 
                    {% endif %} 
        {% endwith %}


    <h2 class="mb-4">Update Trek</h2>

    <form method="POST">

        <label class="form-label">Status:</label><br>
        <select name="status" class="form-select" style="max-width: 400px;">
            <option value="Open" {% if trek.status == "Open" %}selected{% endif %}>Open</option>
            <option value="Closed" {% if trek.status == "Closed" %}selected{% endif %}>Closed</option>
            <option value="Completed" {% if trek.status == "Completed" %}selected{% endif %}>Completed</option>
        </select><br><br>

        <label class="form-label">Available Slots:</label>
        <input type="number" name="available_slots" class="form-control" value="{{ trek.available_slots }}" min="0" max="{{ trek.total_slots }}" required style="max-width: 400px;"><br><br>

        <input type="submit" value="Save Changes" class="btn btn-primary">

    </form>

    <br>

    <a href="{{ url_for('staff_dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>

</div>

</body>
</html>
